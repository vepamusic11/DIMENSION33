# Publica el juego en GitHub Pages en cada push a main.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar antes de publicar
        run: |
          node tools/scan-secrets.mjs
          npm test
      - name: Armar sitio (solo archivos públicos del juego)
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js src assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
